name: CI/CD

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_DATABASE: ${{ secrets.DB_DATABASE }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRE: ${{ secrets.JWT_EXPIRE }}
      UPLOAD_PATH: ${{ secrets.UPLOAD_PATH }}
      UPLOAD_MAX_SIZE: ${{ secrets.UPLOAD_MAX_SIZE }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and test
        run: mvn clean test

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Package application
        run: mvn package -DskipTests

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/robot-diy-forum-0.0.1-SNAPSHOT.jar
          retention-days: 1

  deploy:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: robot-diy-forum-0.0.1-SNAPSHOT.jar
          target: /WorkPlace/robot-diy-forum
          command: |
            APP_DIR="/WorkPlace/robot-diy-forum"
            JAR_FILE="robot-diy-forum-0.0.1-SNAPSHOT.jar"
            PORT=${{ secrets.SERVER_PORT }}

            # Stop old process
            kill $(lsof -t -i:$PORT 2>/dev/null || fuser -k -n tcp $PORT 2>/dev/null) 2>/dev/null || true
            sleep 2

            # Fix CRLF in .env if present
            sed -i 's/\r$//' $APP_DIR/.env 2>/dev/null || true

            # Start application with .env
            cd $APP_DIR
            set -a
            source $APP_DIR/.env
            set +a
            nohup java -jar $APP_DIR/$JAR_FILE > app.log 2>&1 &

            # Health check
            sleep 5
            if pgrep -f "$JAR_FILE" > /dev/null; then
              echo "启动成功"
            else
              echo "启动失败，请检查 app.log"
              exit 1
            fi
