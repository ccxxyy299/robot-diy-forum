name: CI/CD

on:
  push:
    branches: [master]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Package application
        run: mvn package -DskipTests

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/robot-diy-forum-0.0.1-SNAPSHOT.jar
          retention-days: 1

  deploy:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar

      - name: Debug - list files
        run: ls -lh

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Upload JAR to server
        run: |
          scp -i ~/.ssh/deploy_key -P 22 robot-diy-forum-0.0.1-SNAPSHOT.jar ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/WorkPlace/robot-diy-forum/

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command: |
            APP_DIR="/WorkPlace/robot-diy-forum"
            JAR_FILE="robot-diy-forum-0.0.1-SNAPSHOT.jar"
            PORT=${{ secrets.SERVER_PORT }}

            # Stop old process
            kill $(lsof -t -i:$PORT 2>/dev/null || fuser -k -n tcp $PORT 2>/dev/null) 2>/dev/null || true
            sleep 2

            # Fix CRLF in .env if present
            sed -i 's/\r$//' $APP_DIR/.env 2>/dev/null || true

            # Start application with .env
            cd $APP_DIR
            set -a
            source $APP_DIR/.env
            set +a
            nohup java -jar $APP_DIR/$JAR_FILE > app.log 2>&1 &

            # Health check
            sleep 5
            if pgrep -f "$JAR_FILE" > /dev/null; then
              echo "启动成功"
            else
              echo "启动失败，请检查 app.log"
              exit 1
            fi
